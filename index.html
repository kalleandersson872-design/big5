<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Big Five – Personlighetstest</title>

  <style>
    :root{
      --bg:#f7faf8;
      --card:#ffffff;
      --muted:#4b5563;
      --text:#111827;
      --accent:#1f7a3a;
      --accent-dark:#16632f;
      --accent-soft:#eaf4ed;
      --ok:#1f7a3a;
      --warn:#b45309;
      --bad:#b91c1c;
      --bar-muted:#e5e7eb;
      --border:#e5e7eb;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Helvetica,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .wrap{width:100%; max-width:900px}

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:0 18px 45px rgba(17,24,39,0.08);
      overflow:hidden;
    }

    header{
      padding:22px 24px;
      border-bottom:1px solid var(--border);
      display:flex;
      gap:16px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      background:#ffffff;
    }

    h1{
      font-size:24px;
      margin:0;
      font-weight:800;
      color:#111827;
    }

    h2{margin:0 0 8px 0; font-size:22px}
    h3{margin:18px 0 8px 0; font-size:17px}

    .muted{color:var(--muted); font-size:14px}

    .bar{
      height:10px;
      width:100%;
      background:var(--bar-muted);
      border-radius:999px;
      overflow:hidden;
    }

    .bar>span{
      display:block;
      height:100%;
      width:0%;
      background:linear-gradient(90deg,#1f7a3a,#2f9e55);
      transition:width 240ms ease;
    }

    .content{padding:28px 24px}

    .q-meta{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:12px;
    }

    .q-theme{font-size:13px; color:var(--muted)}

    .question{
      font-size:28px;
      line-height:1.35;
      margin:8px 0 18px;
      color:#111827;
      font-weight:800;
    }

    .scale{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:10px;
      margin-top:8px;
    }

    .scale .option{
      background:#ffffff;
      border-radius:12px;
      border:1px solid var(--border);
      cursor:pointer;
      user-select:none;
      transition:transform 120ms ease,border 120ms ease,background 120ms ease;
      font-size:20px;
      font-weight:800;
      line-height:1;
      display:flex;
      align-items:center;
      justify-content:center;
      height:60px;
      color:#111827;
    }

    .scale .option:hover{
      transform:translateY(-1px);
      background:var(--accent-soft);
      border-color:var(--accent);
    }

    .scale .option.active{
      outline:2px solid var(--accent);
      background:var(--accent-soft);
      border-color:var(--accent);
      color:var(--accent);
    }

    .legend{
      display:flex;
      justify-content:space-between;
      font-size:12px;
      color:var(--muted);
      margin-top:8px;
    }

    .actions{
      display:flex;
      justify-content:space-between;
      gap:10px;
      margin-top:26px;
      flex-wrap:wrap;
    }

    .btn{
      appearance:none;
      border:none;
      border-radius:10px;
      padding:14px 18px;
      font-weight:800;
      cursor:pointer;
      background:#ffffff;
      border:2px solid var(--accent);
      color:var(--accent);
      transition:transform 120ms ease, background 120ms ease, border 120ms ease;
      text-transform:uppercase;
      letter-spacing:.3px;
    }

    .btn:hover{transform:translateY(-1px)}

    .btn.primary{
      background:var(--accent);
      color:#ffffff;
      border-color:var(--accent);
    }

    .btn.primary:hover{
      background:var(--accent-dark);
      border-color:var(--accent-dark);
    }

    .btn.ghost{
      background:#ffffff;
      color:var(--accent);
      border-color:var(--accent);
    }

    .btn:disabled{
      opacity:.45;
      cursor:not-allowed;
      transform:none;
    }

    .kbd{
      font-family:ui-monospace,Menlo,Consolas,monospace;
      font-size:12px;
      background:var(--accent-soft);
      color:var(--accent);
      padding:2px 6px;
      border-radius:6px;
      border:1px solid #cfe8d7;
    }

    .result{
      display:grid;
      gap:16px;
      margin-top:14px;
      background:#ffffff;
      padding:18px;
      border:1px solid var(--border);
      border-radius:14px;
      box-shadow:0 10px 30px rgba(17,24,39,0.04);
    }

    .meter{
      height:14px;
      background:var(--bar-muted);
      border-radius:999px;
      overflow:hidden;
    }

    .meter>span{
      display:block;
      height:100%;
      width:0%;
      background:linear-gradient(90deg,#1f7a3a,#2f9e55);
      transition:width 300ms ease;
    }

    .result-row{
      display:grid;
      gap:8px;
      margin-bottom:14px;
    }

    .result-row:last-child{margin-bottom:0}

    .pill{
      display:inline-block;
      padding:4px 8px;
      border-radius:999px;
      font-size:12px;
      border:1px solid var(--border);
      color:var(--accent);
      background:var(--accent-soft);
      margin-left:8px;
    }

    .input{
      width:100%;
      padding:12px 14px;
      border-radius:10px;
      border:1px solid var(--border);
      background:#ffffff;
      color:var(--text);
    }

    .input:focus{
      outline:2px solid var(--accent);
      border-color:var(--accent);
    }

    .hidden{display:none}

    .footer{
      padding:18px 24px;
      border-top:1px solid var(--border);
      display:flex;
      gap:12px;
      justify-content:space-between;
      flex-wrap:wrap;
      background:#ffffff;
    }

    a.btn-link{
      color:var(--accent);
      text-decoration:none;
      font-weight:700;
    }

    @media(max-width:640px){
      body{padding:12px}
      .question{font-size:22px}
      .scale{gap:8px}
      .scale .option{height:52px; font-size:18px}
      .actions{display:grid}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card" id="app">

      <header>
        <div>
          <h1>Big Five – Personlighetstest</h1>
          <div class="muted">
            En fråga i taget. Svara med <span class="kbd">1–5</span>, navigera med pilarna och använd <span class="kbd">Enter</span> för nästa.
          </div>
        </div>

        <div style="min-width:260px">
          <div class="bar" aria-label="Framsteg">
            <span id="progress"></span>
          </div>
          <div class="muted" id="counter" style="text-align:right; margin-top:6px">0 / 50</div>
        </div>
      </header>

      <div class="content" id="questionView">
        <div class="q-meta">
          <div class="q-theme" id="qTheme">Dimension</div>
          <div class="q-theme" id="qId">Fråga 1/50</div>
        </div>

        <div class="question" id="qText">…</div>

        <div class="scale" id="scale"></div>

        <div class="legend">
          <span>1 = Stämmer inte alls</span>
          <span>5 = Stämmer helt</span>
        </div>

        <div class="actions">
          <button class="btn ghost" id="prevBtn" disabled>Föregående</button>

          <div style="display:flex; gap:10px; flex-wrap:wrap">
            <button class="btn ghost" id="clearBtn">Rensa</button>
            <button class="btn primary" id="nextBtn">Nästa</button>
          </div>
        </div>
      </div>

      <div class="content hidden" id="resultView" aria-live="polite">
        <div class="result" id="resultContainer"></div>
      </div>

      <div class="footer">
        <div class="muted">All data hanteras lokalt i webbläsaren.</div>
        <div><a class="btn-link" href="#" id="jumpUnanswered">Hoppa till obesvarad</a></div>
      </div>

    </div>
  </div>

  <script>
    const LABELS = {
      1: "Stämmer inte alls",
      2: "Stämmer lite",
      3: "Neutral / delvis",
      4: "Stämmer mycket",
      5: "Stämmer helt"
    };

    const DIMENSIONS = {
      O: "Öppenhet",
      C: "Samvetsgrannhet",
      E: "Extraversion",
      A: "Vänlighet",
      N: "Neuroticism"
    };

    const QUESTIONS = [
      {id:1, d:"O", text:"Jag tycker om att prova nya saker.", reverse:false},
      {id:2, d:"O", text:"Jag har ett livligt fantasiliv.", reverse:false},
      {id:3, d:"O", text:"Jag är intresserad av konst, musik eller litteratur.", reverse:false},
      {id:4, d:"O", text:"Jag funderar ofta på filosofiska eller abstrakta frågor.", reverse:false},
      {id:5, d:"O", text:"Jag uppskattar förändring och variation.", reverse:false},
      {id:6, d:"O", text:"Jag föredrar rutiner framför nya upplevelser.", reverse:true},
      {id:7, d:"O", text:"Jag tycker det är stimulerande att lära mig om nya idéer.", reverse:false},
      {id:8, d:"O", text:"Jag föredrar det bekanta framför det okända.", reverse:true},
      {id:9, d:"O", text:"Jag är kreativ i mitt arbete eller på fritiden.", reverse:false},
      {id:10, d:"O", text:"Jag tycker om att reflektera över djupa frågor.", reverse:false},

      {id:11, d:"C", text:"Jag planerar ofta i förväg.", reverse:false},
      {id:12, d:"C", text:"Jag slutför alltid det jag påbörjar.", reverse:false},
      {id:13, d:"C", text:"Jag tycker om att ha ordning omkring mig.", reverse:false},
      {id:14, d:"C", text:"Jag kan motstå frestelser för att nå långsiktiga mål.", reverse:false},
      {id:15, d:"C", text:"Jag är punktlig.", reverse:false},
      {id:16, d:"C", text:"Jag skjuter ofta upp saker jag borde göra.", reverse:true},
      {id:17, d:"C", text:"Jag arbetar hårt för att uppnå mina mål.", reverse:false},
      {id:18, d:"C", text:"Jag låter ofta slumpen styra mina handlingar.", reverse:true},
      {id:19, d:"C", text:"Jag tar ansvar för mina åtaganden.", reverse:false},
      {id:20, d:"C", text:"Jag har lätt för att organisera mitt arbete.", reverse:false},

      {id:21, d:"E", text:"Jag tycker om att umgås i stora grupper.", reverse:false},
      {id:22, d:"E", text:"Jag känner mig energifylld när jag är med andra människor.", reverse:false},
      {id:23, d:"E", text:"Jag tar ofta initiativ i sociala sammanhang.", reverse:false},
      {id:24, d:"E", text:"Jag blir snabbt bekväm i nya sociala situationer.", reverse:false},
      {id:25, d:"E", text:"Jag talar gärna i centrum för uppmärksamhet.", reverse:false},
      {id:26, d:"E", text:"Jag föredrar ofta att vara ensam.", reverse:true},
      {id:27, d:"E", text:"Jag har lätt för att skapa nya kontakter.", reverse:false},
      {id:28, d:"E", text:"Jag är entusiastisk i mina aktiviteter.", reverse:false},
      {id:29, d:"E", text:"Jag har många vänner och bekanta.", reverse:false},
      {id:30, d:"E", text:"Jag är tystlåten och reserverad.", reverse:true},

      {id:31, d:"A", text:"Jag litar på att människor vill mig väl.", reverse:false},
      {id:32, d:"A", text:"Jag hjälper gärna andra utan att förvänta mig något tillbaka.", reverse:false},
      {id:33, d:"A", text:"Jag är tolerant mot personer som tycker annorlunda än jag.", reverse:false},
      {id:34, d:"A", text:"Jag försöker undvika konflikter.", reverse:false},
      {id:35, d:"A", text:"Jag uppfattas som vänlig och omtänksam.", reverse:false},
      {id:36, d:"A", text:"Jag sätter ofta mina egna behov först.", reverse:true},
      {id:37, d:"A", text:"Jag visar empati för andras känslor.", reverse:false},
      {id:38, d:"A", text:"Jag samarbetar hellre än tävlar.", reverse:false},
      {id:39, d:"A", text:"Jag är generös med min tid och energi.", reverse:false},
      {id:40, d:"A", text:"Jag misstänker ofta andras motiv.", reverse:true},

      {id:41, d:"N", text:"Jag oroar mig ofta för saker.", reverse:false},
      {id:42, d:"N", text:"Jag blir lätt stressad.", reverse:false},
      {id:43, d:"N", text:"Jag känner mig ofta osäker.", reverse:false},
      {id:44, d:"N", text:"Jag har svårt att hantera motgångar.", reverse:false},
      {id:45, d:"N", text:"Jag blir lätt nedstämd.", reverse:false},
      {id:46, d:"N", text:"Jag är lugn och stabil i de flesta situationer.", reverse:true},
      {id:47, d:"N", text:"Jag blir lätt irriterad.", reverse:false},
      {id:48, d:"N", text:"Jag känner mig ofta sårbar.", reverse:false},
      {id:49, d:"N", text:"Jag reagerar starkt på kritik.", reverse:false},
      {id:50, d:"N", text:"Jag upplever mig oftast balanserad och trygg.", reverse:true}
    ];

    const STORAGE_KEY = "bigfive_one_question_answers";

    const state = {
      index:0,
      answers:Array(QUESTIONS.length).fill(null)
    };

    const $ = sel => document.querySelector(sel);

    const progressEl = $('#progress');
    const counterEl = $('#counter');
    const qThemeEl = $('#qTheme');
    const qIdEl = $('#qId');
    const qTextEl = $('#qText');
    const scaleEl = $('#scale');
    const prevBtn = $('#prevBtn');
    const nextBtn = $('#nextBtn');
    const clearBtn = $('#clearBtn');
    const questionView = $('#questionView');
    const resultView = $('#resultView');
    const resultContainer = $('#resultContainer');
    const jumpUnanswered = $('#jumpUnanswered');

    function loadAnswers(){
      const saved = localStorage.getItem(STORAGE_KEY);

      if(!saved){
        return;
      }

      try{
        const parsed = JSON.parse(saved);

        if(Array.isArray(parsed) && parsed.length === QUESTIONS.length){
          state.answers = parsed;
        }
      }catch(e){}
    }

    function saveAnswers(){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.answers));
    }

    function percentComplete(){
      const answered = state.answers.filter(v => v !== null).length;
      return Math.round((answered / QUESTIONS.length) * 100);
    }

    function updateProgress(){
      progressEl.style.width = percentComplete() + '%';
      counterEl.textContent = `${state.index + 1} / ${QUESTIONS.length}`;
    }

    function renderQuestion(){
      const q = QUESTIONS[state.index];

      qThemeEl.textContent = `${DIMENSIONS[q.d]}${q.reverse ? " · omvänd skala" : ""}`;
      qIdEl.textContent = `Fråga ${state.index + 1}/${QUESTIONS.length}`;
      qTextEl.textContent = q.text;

      scaleEl.innerHTML = '';

      for(let i = 1; i <= 5; i++){
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'option';
        el.textContent = i;
        el.title = `${i} – ${LABELS[i]}`;

        if(state.answers[state.index] === i){
          el.classList.add('active');
        }

        el.addEventListener('click', () => {
          state.answers[state.index] = i;
          saveAnswers();
          renderQuestion();
        });

        scaleEl.appendChild(el);
      }

      prevBtn.disabled = state.index === 0;
      clearBtn.disabled = state.answers[state.index] === null;
      nextBtn.textContent = state.index === QUESTIONS.length - 1 ? 'Visa resultat' : 'Nästa';

      updateProgress();
    }

    function next(){
      if(state.answers[state.index] === null){
        shake(scaleEl);
        return;
      }

      if(state.index < QUESTIONS.length - 1){
        state.index++;
        renderQuestion();
      } else {
        showResult();
      }
    }

    function prev(){
      if(state.index > 0){
        state.index--;
        renderQuestion();
      }
    }

    function clearAnswer(){
      state.answers[state.index] = null;
      saveAnswers();
      renderQuestion();
    }

    function shake(node){
      node.animate(
        [
          {transform:'translateX(0)'},
          {transform:'translateX(-6px)'},
          {transform:'translateX(6px)'},
          {transform:'translateX(0)'}
        ],
        {duration:180}
      );
    }

    function adjustedScore(value, reverse){
      return reverse ? 6 - value : value;
    }

    function scoreResults(){
      const scores = {
        O:0,
        C:0,
        E:0,
        A:0,
        N:0
      };

      QUESTIONS.forEach((q, i) => {
        const raw = state.answers[i];

        if(raw === null){
          return;
        }

        scores[q.d] += adjustedScore(raw, q.reverse);
      });

      return scores;
    }

    function bandLabel(score){
      if(score <= 24){
        return "Lägre nivå";
      }

      if(score <= 37){
        return "Medelnivå";
      }

      return "Hög nivå";
    }

    function showResult(){
      if(state.answers.some(v => v === null)){
        const idx = state.answers.findIndex(v => v === null);
        state.index = idx >= 0 ? idx : 0;
        renderQuestion();
        return;
      }

      questionView.classList.add('hidden');
      resultView.classList.remove('hidden');

      resultContainer.innerHTML = `
        <h2>Lås upp ditt resultat</h2>

        <p class="muted">
          För att se din fullständiga Big Five-profil behöver du genomföra betalning via Swish.
        </p>

        <div style="display:grid; gap:18px; justify-items:center; margin-top:12px;">

          <img
            src="swish-qr.png"
            alt="Swish QR"
            style="
              width:220px;
              border-radius:18px;
              border:1px solid var(--border);
              background:#ffffff;
              padding:12px;
            "
          >

          <div style="text-align:center;">
            <div style="font-size:30px; font-weight:800; color:var(--accent);">
              19 KR
            </div>

            <div class="muted">
              Swisha och klicka därefter på ”Jag har betalat”.
            </div>
          </div>

        </div>

        <div style="margin-top:24px; display:grid; gap:12px;">

          <button class="btn primary" id="paidBtn">
            Jag har betalat
          </button>

          <div id="passwordWrap" class="hidden">

            <input
              type="password"
              id="resultPassword"
              class="input"
              placeholder="Ange lösenord"
            >

            <button class="btn primary" id="unlockBtn" style="margin-top:10px;">
              Lås upp resultat
            </button>

            <div
              id="pwError"
              style="
                color:#b91c1c;
                font-size:13px;
                margin-top:8px;
                display:none;
              "
            >
              Fel lösenord
            </div>

          </div>

        </div>
      `;

      document.getElementById('paidBtn').addEventListener('click', () => {
        document.getElementById('passwordWrap').classList.remove('hidden');
      });

      document.getElementById('unlockBtn').addEventListener('click', () => {
        const pw = document.getElementById('resultPassword').value.trim();

        if(pw !== "hejhej123"){
          document.getElementById('pwError').style.display = 'block';
          return;
        }

        renderActualResults();
      });
    }

    function renderActualResults(){
      const scores = scoreResults();

      resultContainer.innerHTML = `
        <h2>Ditt resultat</h2>

        <div class="muted">
          Resultatet visas som staplar per Big Five-dimension.
        </div>
      `;

      Object.entries(DIMENSIONS).forEach(([key, name]) => {
        const score = scores[key];
        const percent = Math.round((score / 50) * 100);

        const row = document.createElement('div');
        row.className = 'result-row';

        row.innerHTML = `
          <div>
            <strong>${name}</strong>
            <span class="pill">${score}/50 · ${bandLabel(score)}</span>
          </div>

          <div class="meter" aria-label="${name}">
            <span style="width:${percent}%"></span>
          </div>
        `;

        resultContainer.appendChild(row);
      });

      const actions = document.createElement('div');
      actions.className = 'actions';

      actions.innerHTML = `
        <button class="btn ghost" id="restartBtn2">
          Starta om
        </button>

        <button class="btn primary" id="exportBtn2">
          Exportera resultat
        </button>

        <button class="btn ghost" id="printBtn2">
          Skriv ut / PDF
        </button>
      `;

      resultContainer.appendChild(actions);

      document.getElementById('restartBtn2').addEventListener('click', restart);
      document.getElementById('exportBtn2').addEventListener('click', exportTxt);
      document.getElementById('printBtn2').addEventListener('click', () => window.print());
    }

    function restart(){
      state.index = 0;
      state.answers = Array(QUESTIONS.length).fill(null);
      localStorage.removeItem(STORAGE_KEY);
      resultView.classList.add('hidden');
      questionView.classList.remove('hidden');
      renderQuestion();
    }

    function exportTxt(){
      const ts = new Date();
      const pad = n => String(n).padStart(2,'0');
      const stamp = `${ts.getFullYear()}-${pad(ts.getMonth()+1)}-${pad(ts.getDate())} ${pad(ts.getHours())}:${pad(ts.getMinutes())}`;

      const scores = scoreResults();

      let lines = [];
      lines.push("Big Five – Personlighetstest");
      lines.push(`Datum: ${stamp}`);
      lines.push("");
      lines.push("Resultat:");

      Object.entries(DIMENSIONS).forEach(([key, name]) => {
        const score = scores[key];
        lines.push(`${name}: ${score}/50 – ${bandLabel(score)}`);
      });

      lines.push("");
      lines.push("Svar per fråga:");

      QUESTIONS.forEach((q, i) => {
        const val = state.answers[i] ?? "-";
        const label = LABELS[val] || "-";
        lines.push(`Fråga ${q.id} | ${DIMENSIONS[q.d]} | ${q.text} — Svar: ${val} (${label})${q.reverse ? " | Omvänd skala" : ""}`);
      });

      const blob = new Blob([lines.join('\n')], {type:'text/plain;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');

      a.href = url;
      a.download = `big-five-test_${ts.getFullYear()}-${pad(ts.getMonth()+1)}-${pad(ts.getDate())}_${pad(ts.getHours())}${pad(ts.getMinutes())}.txt`;

      document.body.appendChild(a);
      a.click();
      URL.revokeObjectURL(url);
      a.remove();
    }

    function firstUnansweredIndex(){
      return state.answers.findIndex(v => v === null);
    }

    document.addEventListener('keydown', (e) => {
      if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA'){
        return;
      }

      if(!resultView.classList.contains('hidden')){
        return;
      }

      if(['1','2','3','4','5'].includes(e.key)){
        const val = parseInt(e.key, 10);
        state.answers[state.index] = val;
        saveAnswers();
        renderQuestion();
        return;
      }

      if(e.key === 'ArrowRight'){
        next();
        return;
      }

      if(e.key === 'ArrowLeft'){
        prev();
        return;
      }

      if(e.key === 'Enter'){
        next();
      }
    });

    nextBtn.addEventListener('click', next);
    prevBtn.addEventListener('click', prev);
    clearBtn.addEventListener('click', clearAnswer);

    jumpUnanswered.addEventListener('click', (e) => {
      e.preventDefault();

      const idx = firstUnansweredIndex();

      if(idx >= 0){
        state.index = idx;
        questionView.classList.remove('hidden');
        resultView.classList.add('hidden');
        renderQuestion();
      }
    });

    loadAnswers();
    renderQuestion();
  </script>
</body>
</html>
